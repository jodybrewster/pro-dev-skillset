name: Hook tests on macOS

# macOS runners bill at ten times the Linux rate on a private repo, so this runs only
# when a hook script, a hook test or this file changes; a newer push cancels an older run.
on:
  pull_request:
    paths:
      - "plugins/**/scripts/**"
      - "plugins/**/hooks/**"
      - "tests/**"
      - ".github/workflows/hooks-macos.yml"
  workflow_dispatch:

concurrency:
  group: hooks-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks-macos:
    name: Hook tests on macOS (system Python)
    runs-on: macos-latest
    # check.mjs alone takes about ten minutes on this runner
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The image puts a Homebrew python3 ahead of /usr/bin; the hooks must run on the system one.
      - name: Put the system Python first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/system-python"
          ln -sf /usr/bin/python3 "$RUNNER_TEMP/system-python/python3"
          echo "$RUNNER_TEMP/system-python" >> "$GITHUB_PATH"

      - name: System Python is 3.9
        run: |
          python3 --version
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 9), sys.version'

      - name: Static checks and hook behaviour cases
        run: node tests/check.mjs

  # TODO: Add Codex parity smoke check once the Codex CLI plugin marketplace
  # commands are stable and documented. The README references
  # `codex-cli 0.122.0-alpha.13`, but the exact `codex plugin ...` invocation
  # for adding a local marketplace path is not confirmed. Re-enable as a
  # separate job with `continue-on-error: true` once verified.
