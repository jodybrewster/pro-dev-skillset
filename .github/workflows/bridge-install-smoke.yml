name: bridge skills install (network)

# Network-dependent smoke test for the bridge install paths: taste-skills-bridge,
# web-design-engineer-bridge, mengto-skills-bridge, tastemaker-bridge and
# next-skills-bridge. Not part of the required PR gate - it needs network access
# to reach the external repos, so it runs on demand and weekly.
on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  install-smoke:
    name: npx skills add for every bridge (taste-skill, garden-skills, MengTo, tastemaker, vercel/next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install each bridged library into a temp dir and verify
        run: node tests/bridge-install-smoke.mjs
